title: Reticulous
tagline: Reticulum mesh networking for ESP32
description: >-
  Reticulous implements the Reticulum mesh networking stack for ESP32 boards,
  with LXMF messaging, Nomad Network browsing, a web interface, an LCD shell
  and remote management over the mesh.
email: rop@spangap.org
github_org: https://github.com/reticulous

# The site's own domain. Jekyll builds `absolute_url` — the canonical link and
# every entry in the sitemap — from this, so it is the one place the domain is
# stated in the site's content. Which host the deploy actually answers on is a
# separate setting, in the repo's Pages configuration; see README, "The domain".
url: https://reticulous.net
baseurl: ""

# The sibling site. Every cross-site link goes through this, so the two move
# to their own domains one line at a time instead of one link at a time. Links
# inside this site use `relative_url` and need no such thing.
spangap_url: https://spangap.github.io

nav:
  - name: Overview
    url: /overview/
  - name: Flashing
    url: /flashing/
  - name: Building
    url: /building/

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Deploy-time inputs, not site content. /flashmon/ and /builds/ are laid in by
  # .github/workflows/pages.yml after Jekyll has run.
  - catalogues
  - tools
